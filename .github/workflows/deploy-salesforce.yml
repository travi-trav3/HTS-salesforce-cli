name: Deploy to Salesforce

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'force-app/**'
      - 'deploy.sh'
      - '.github/workflows/deploy-salesforce.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --alias hts-prod --set-default
          rm auth_url.txt

      - name: Retrieve task reports (guards in-org filter fixes; temporary)
        run: |
          sf project retrieve start \
            --metadata "Report:HTS_Outreach_Reports/Dylan_Task_Completion" \
            --metadata "Report:HTS_Outreach_Reports/Tasks_Completed_This_Week" \
            --target-org hts-prod --wait 10
          echo "=====BEGIN DYLAN_TASK_COMPLETION_XML====="
          cat "force-app/main/default/reports/HTS_Outreach_Reports/Dylan_Task_Completion.report-meta.xml"
          echo "=====END DYLAN_TASK_COMPLETION_XML====="
          echo "=====BEGIN TASKS_COMPLETED_XML====="
          cat "force-app/main/default/reports/HTS_Outreach_Reports/Tasks_Completed_This_Week.report-meta.xml"
          echo "=====END TASKS_COMPLETED_XML====="

      - name: Deploy metadata
        run: |
          chmod +x deploy.sh
          ./deploy.sh
