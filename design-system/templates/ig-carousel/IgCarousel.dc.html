<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram — Carousel body slide" description="1080×1350 sequential explainer slide with a numbered step marker, hero imagery and progress dots. Maps to the 'how it works' flow." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap");
</style>
</helmet>
<div style="width:1080px;height:1350px;background:#030712;position:relative;overflow:hidden;font-family:'Montserrat',sans-serif;box-sizing:border-box;padding:72px 80px 80px;display:flex;flex-direction:column;">

  <!-- decorative brand glow -->
  <sc-if value="{{ showGlow }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:-220px;right:-200px;width:760px;height:760px;border-radius:999px;background:radial-gradient(circle at 50% 50%, rgba(10,203,64,0.22) 0%, rgba(10,203,64,0) 70%);pointer-events:none;"></div>
  </sc-if>

  <!-- header -->
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;flex:none;">
    <img src="../../assets/img/wordmark-clubpilot.png" alt="clubpilot" style="height:88px;width:auto;display:block;" />
    <span style="color:rgba(255,255,255,0.5);font-size:24px;font-weight:500;letter-spacing:0.04em;">02 / 05</span>
  </div>

  <!-- step marker + copy -->
  <div style="position:relative;flex:none;margin-top:56px;">
    <div style="display:flex;align-items:center;gap:24px;margin-bottom:40px;">
      <div style="width:96px;height:96px;border-radius:999px;background:linear-gradient(180deg,#0acb40 0%,#004b31 150%);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:#03210f;">2</div>
      <div style="color:#45ff16;font-size:28px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;">The Step</div>
    </div>

    <h2 style="margin:0;font-size:68px;font-weight:600;line-height:1.1;letter-spacing:-0.01em;color:#ffffff;">
      Members Text the Club.<br><span style="color:#0acb40;">Aimi Answers Instantly.</span>
    </h2>
    <p style="margin:32px 0 0;font-size:30px;font-weight:500;line-height:1.34;color:rgba(255,255,255,0.74);max-width:820px;">
      No app to download, no menu to learn. A member texts a question and the AI Assist concierge replies in seconds — day or night.
    </p>
  </div>

  <!-- hero imagery (tweakable) -->
  <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;margin-top:44px;flex:none;height:320px;border-radius:24px;overflow:hidden;background:#0b1018;border:1px solid rgba(255,255,255,0.10);box-shadow:0 25px 50px -12px rgba(3,7,18,0.65);">
      <sc-if value="{{ showConcierge }}" hint-placeholder-val="{{ true }}">
        <img src="../../assets/img/aimi-concierge.png" alt="Club Pilot concierge" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:18px;box-sizing:border-box;" />
      </sc-if>
      <sc-if value="{{ showDashboard }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/dashboard-laptop.png" alt="Club Pilot dashboard" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:24px;box-sizing:border-box;" />
      </sc-if>
      <sc-if value="{{ showClubs }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/club-logos.png" alt="Member clubs on Club Pilot" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:30px;box-sizing:border-box;" />
      </sc-if>
    </div>
  </sc-if>

  <!-- progress dots (tweakable) -->
  <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;margin-top:auto;display:flex;gap:14px;align-items:center;">
      <span style="width:18px;height:18px;border-radius:999px;background:rgba(255,255,255,0.25);"></span>
      <span style="width:48px;height:18px;border-radius:999px;background:#0acb40;"></span>
      <span style="width:18px;height:18px;border-radius:999px;background:rgba(255,255,255,0.25);"></span>
      <span style="width:18px;height:18px;border-radius:999px;background:rgba(255,255,255,0.25);"></span>
      <span style="width:18px;height:18px;border-radius:999px;background:rgba(255,255,255,0.25);"></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;imagery&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Member concierge&quot;,&quot;Product dashboard&quot;,&quot;Member clubs&quot;,&quot;None&quot;],&quot;default&quot;:&quot;Member concierge&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showGlow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const imagery = this.props.imagery ?? "Member concierge";
    return {
      showGlow:      this.props.showGlow ?? true,
      showProgress:  this.props.showProgress ?? true,
      showImage:     imagery !== "None",
      showConcierge: imagery === "Member concierge",
      showDashboard: imagery === "Product dashboard",
      showClubs:     imagery === "Member clubs",
    };
  }
}
</script>
</body>
</html>
