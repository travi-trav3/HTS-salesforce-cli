<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Static ad (1080×1080)" description="Meta/Instagram placement ad — hook, proof, single CTA." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap");
</style>
</helmet>
<div style="width:1080px;height:1080px;background:#030712;position:relative;overflow:hidden;font-family:'Montserrat',sans-serif;box-sizing:border-box;">

  <!-- cut-out concierge anchored bottom-right -->
  <div style="position:absolute;right:-40px;bottom:0;width:520px;height:680px;">
    <img src="../../assets/img/aimi-concierge.png" alt="Aimi" style="width:100%;height:100%;object-fit:cover;object-position:top center;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent);" />
  </div>

  <div style="position:absolute;top:72px;left:72px;">
    <img src="../../assets/img/wordmark-clubpilot.png" alt="clubpilot" style="height:88px;width:auto;display:block;" />
  </div>

  <div style="position:absolute;left:72px;top:220px;width:620px;">
    <div style="color:#0acb40;font-size:26px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:24px;">Meet Aimi</div>
    <h1 style="margin:0;font-size:74px;font-weight:600;line-height:1.06;letter-spacing:-0.02em;color:#ffffff;">
      Your AI Concierge,<br><span style="color:#0acb40;">on Call 24/7.</span>
    </h1>
    <p style="margin:32px 0 0;font-size:28px;font-weight:500;line-height:1.36;color:rgba(255,255,255,0.74);max-width:520px;">
      Answer member questions instantly by text — and free your staff for the moments that matter.
    </p>
  </div>

  <a href="#" style="position:absolute;left:72px;bottom:150px;display:inline-flex;align-items:center;justify-content:center;padding:26px 56px;border-radius:999px;background:linear-gradient(180deg,#ed5901 0%,#b83c00 100%);box-shadow:0 16px 36px -10px rgba(237,89,1,0.5);color:#fff;font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;">Book a Demo</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1080}}"></script>
</body>
</html>
