<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram — Stat / Proof card" description="1080×1350 proof card with an oversized numeral treatment (e.g. 98%)." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap");
</style>
</helmet>
<div style="width:1080px;height:1350px;background:#030712;position:relative;overflow:hidden;font-family:'Montserrat',sans-serif;box-sizing:border-box;">

  <div style="position:absolute;top:72px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;">
    <img src="../../assets/img/wordmark-clubpilot.png" alt="clubpilot" style="height:88px;width:auto;display:block;" />
  </div>

  <div style="position:absolute;left:80px;top:0;bottom:0;right:80px;display:flex;flex-direction:column;justify-content:center;">
    <div style="color:#0acb40;font-size:30px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">The Proof</div>
    <div style="font-size:420px;font-weight:700;line-height:0.86;letter-spacing:-0.04em;color:#ffffff;">98<span style="color:#0acb40;">%</span></div>
    <div style="font-size:48px;font-weight:600;line-height:1.18;color:#ffffff;margin-top:24px;max-width:820px;">
      Of Text Messages Are Opened <span style="color:#0acb40;">Within 3 Minutes.</span>
    </div>
    <p style="margin:28px 0 0;font-size:30px;font-weight:500;line-height:1.36;color:rgba(255,255,255,0.66);max-width:760px;">
      Email open rates are falling. Text is the channel members actually read — and act on.
    </p>
  </div>

  <div style="position:absolute;left:80px;bottom:170px;color:rgba(255,255,255,0.5);font-size:24px;font-weight:500;">Source: Club Pilot &middot; @clubpilot</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350}}"></script>
</body>
</html>
