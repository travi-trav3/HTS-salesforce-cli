<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram — Press / Feature callout" description="1080×1350 press callout — Golf Digest Coolest New Product, top-voted PGA Show booth." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap");
</style>
</helmet>
<div style="width:1080px;height:1350px;background:#030712;position:relative;overflow:hidden;font-family:'Montserrat',sans-serif;box-sizing:border-box;padding:72px 80px 80px;display:flex;flex-direction:column;">

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex:none;">
    <img src="../../assets/img/wordmark-clubpilot.png" alt="clubpilot" style="height:88px;width:auto;display:block;" />
    <span style="display:inline-flex;align-items:center;padding:12px 24px;border-radius:999px;background:#ef6a24;color:#fff;font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;">In the press</span>
  </div>

  <!-- quote / award callout -->
  <div style="flex:none;margin-top:52px;">
    <div style="color:#0acb40;font-size:30px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:20px;">Recognized at the PGA Show</div>

    <h1 style="margin:0;font-size:82px;font-weight:600;line-height:1.07;letter-spacing:-0.02em;color:#ffffff;">
      &ldquo;Coolest New Product&rdquo;<br><span style="color:#0acb40;">&mdash; Golf Digest, 2026</span>
    </h1>
    <p style="margin:36px 0 0;font-size:30px;font-weight:500;line-height:1.34;color:rgba(255,255,255,0.74);max-width:840px;">
      Featured in Golf Digest, Golf Bizz Review and CMAA &mdash; and ranked among the most-visited booths of the entire 2026 PGA Show.
    </p>
  </div>

  <!-- optional hero imagery (tweakable) -->
  <sc-if value="{{ showImage }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;margin-top:40px;flex:none;height:288px;border-radius:24px;overflow:hidden;background:#0b1018;border:1px solid rgba(255,255,255,0.10);box-shadow:0 25px 50px -12px rgba(3,7,18,0.65);">
      <sc-if value="{{ showClubs }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/club-logos.png" alt="Member clubs on Club Pilot" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:30px;box-sizing:border-box;" />
      </sc-if>
      <sc-if value="{{ showConcierge }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/aimi-concierge.png" alt="Club Pilot concierge" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;" />
      </sc-if>
      <sc-if value="{{ showDashboard }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/dashboard-laptop.png" alt="Club Pilot dashboard" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:24px;box-sizing:border-box;" />
      </sc-if>
    </div>
  </sc-if>

  <!-- press badges row (tweakable) -->
  <sc-if value="{{ showPressRow }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:auto;">
      <div style="color:rgba(255,255,255,0.5);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:22px;">As Seen In</div>
      <div style="display:flex;align-items:center;gap:34px;flex-wrap:wrap;">
        <img src="../../assets/img/golf-digest-wordmark.png" alt="Golf Digest" style="height:48px;width:auto;display:block;filter:invert(1);" />
        <span style="width:1px;height:44px;background:rgba(255,255,255,0.22);flex:none;"></span>
        <span style="font-family:'Playfair Display',Georgia,serif;font-size:46px;font-weight:700;font-style:italic;letter-spacing:-0.01em;color:#ffffff;">Golf Bizz Review</span>
      </div>
      <div style="margin-top:32px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;">
        <span style="display:inline-flex;align-items:center;gap:12px;padding:15px 30px;border-radius:12px;background:#2f3b4d;border:1px solid rgba(255,255,255,0.18);color:#ffffff;font-size:25px;font-weight:600;">
          <span style="width:12px;height:12px;border-radius:999px;background:#ef6a24;flex:none;"></span>
          PGA Show 2026
        </span>
        <span style="display:inline-flex;align-items:center;gap:12px;padding:15px 32px;border-radius:999px;background:#0acb40;color:#03210f;font-size:25px;font-weight:700;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#03210f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><path d="M9 14.4L7.8 22l4.2-2.3L16.2 22 15 14.4"></path></svg>
          Top Booth
        </span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;imagery&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;None&quot;,&quot;Member clubs&quot;,&quot;Member concierge&quot;,&quot;Product dashboard&quot;],&quot;default&quot;:&quot;Product dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showPressRow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const imagery = this.props.imagery ?? "None";
    return {
      showPressRow:  this.props.showPressRow ?? true,
      showImage:     imagery !== "None",
      showClubs:     imagery === "Member clubs",
      showConcierge: imagery === "Member concierge",
      showDashboard: imagery === "Product dashboard",
    };
  }
}
</script>
</body>
</html>
