<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Announcement / Event promo (1080×1350)" description="Event or announcement unit — date, headline, location, CTA, swappable hero imagery." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap");
</style>
</helmet>
<div style="width:1080px;height:1350px;background:#030712;font-family:'Montserrat',sans-serif;box-sizing:border-box;padding:72px 80px 80px;display:flex;flex-direction:column;overflow:hidden;">

  <!-- header: wordmark + save-the-date calendar stamp -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;flex:none;">
    <img src="../../assets/img/wordmark-clubpilot.png" alt="clubpilot" style="height:88px;width:auto;display:block;margin-top:10px;" />
    <sc-if value="{{ showDate }}" hint-placeholder-val="{{ true }}">
      <div style="display:inline-flex;flex-direction:column;align-items:center;width:150px;border-radius:20px;overflow:hidden;background:#101828;box-shadow:0 25px 50px -12px rgba(3,7,18,0.65);flex:none;">
        <span style="align-self:stretch;text-align:center;padding:10px 0;background:#0acb40;color:#03210f;font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;">Jan</span>
        <span style="font-size:76px;font-weight:700;color:#ffffff;line-height:1.1;margin-top:6px;">27</span>
        <span style="font-size:22px;font-weight:500;color:#95a0b3;margin-bottom:16px;">2026</span>
      </div>
    </sc-if>
  </div>

  <!-- text block -->
  <div style="flex:none;margin-top:56px;">
    <div style="color:#0acb40;font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:22px;">Save the Date</div>
    <h1 style="margin:0;font-size:74px;font-weight:600;line-height:1.06;letter-spacing:-0.02em;color:#ffffff;">
      See Club Pilot Live<br><span style="color:#0acb40;">at the PGA Show.</span>
    </h1>
    <p style="margin:32px 0 0;font-size:30px;font-weight:500;line-height:1.34;color:rgba(255,255,255,0.74);max-width:820px;">
      Booth 3191 &middot; Orange County Convention Center, Orlando. Voted #2 Booth overall — come see why.
    </p>
  </div>

  <!-- hero imagery (tweakable) -->
  <sc-if value="{{ showImage }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:48px;flex:none;height:362px;border-radius:24px;overflow:hidden;background:#0b1018;border:1px solid rgba(255,255,255,0.10);box-shadow:0 25px 50px -12px rgba(3,7,18,0.65);position:relative;">
      <sc-if value="{{ showDashboard }}" hint-placeholder-val="{{ true }}">
        <img src="../../assets/img/dashboard-laptop.png" alt="Club Pilot dashboard" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:26px;box-sizing:border-box;" />
      </sc-if>
      <sc-if value="{{ showConcierge }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/aimi-concierge.png" alt="Club Pilot concierge" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;" />
      </sc-if>
      <sc-if value="{{ showClubs }}" hint-placeholder-val="{{ false }}">
        <img src="../../assets/img/club-logos.png" alt="Member clubs on Club Pilot" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:34px 30px;box-sizing:border-box;" />
      </sc-if>
    </div>
  </sc-if>

  <!-- CTA (accent tweak swaps the gradient) -->
  <sc-if value="{{ ctaAzure }}" hint-placeholder-val="{{ true }}">
    <a href="#" style="margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;padding:26px 56px;border-radius:999px;background:linear-gradient(180deg,#009ee8 0%,#006fa7 100%);box-shadow:0 16px 36px -10px rgba(0,158,232,0.45);color:#fff;font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;">Reserve a Demo Slot</a>
  </sc-if>
  <sc-if value="{{ ctaOrange }}" hint-placeholder-val="{{ false }}">
    <a href="#" style="margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;padding:26px 56px;border-radius:999px;background:linear-gradient(180deg,#ed5901 0%,#b83c00 100%);box-shadow:0 16px 36px -10px rgba(237,89,1,0.45);color:#fff;font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;">Reserve a Demo Slot</a>
  </sc-if>
  <sc-if value="{{ ctaGreen }}" hint-placeholder-val="{{ false }}">
    <a href="#" style="margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;padding:26px 56px;border-radius:999px;background:linear-gradient(180deg,#0acb40 0%,#004b31 100%);box-shadow:0 16px 36px -10px rgba(10,203,64,0.42);color:#fff;font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;">Reserve a Demo Slot</a>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;imagery&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Product dashboard&quot;,&quot;Member concierge&quot;,&quot;Member clubs&quot;,&quot;None&quot;],&quot;default&quot;:&quot;Product dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Azure&quot;,&quot;Orange&quot;,&quot;Green&quot;],&quot;default&quot;:&quot;Azure&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showDate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const imagery = this.props.imagery ?? "Product dashboard";
    const accent  = this.props.accent ?? "Azure";
    const showDate = this.props.showDate ?? true;
    return {
      showDate,
      showImage:     imagery !== "None",
      showDashboard: imagery === "Product dashboard",
      showConcierge: imagery === "Member concierge",
      showClubs:     imagery === "Member clubs",
      ctaAzure:  accent === "Azure",
      ctaOrange: accent === "Orange",
      ctaGreen:  accent === "Green",
    };
  }
}
</script>
</body>
</html>
