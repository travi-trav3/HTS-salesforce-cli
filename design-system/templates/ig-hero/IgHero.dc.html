<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Instagram — Hero / Cover" description="1080×1350 cover that presents the Triad of Power as three clearly-labeled pillars (AI Assist, Text Messaging, Member App), each with icon and one-liner." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap");
</style>
</helmet>
<div style="width:1080px;height:1350px;background:#030712;position:relative;overflow:hidden;font-family:'Montserrat',sans-serif;box-sizing:border-box;">

  <!-- top bar -->
  <div style="position:absolute;top:72px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;">
    <img src="../../assets/img/wordmark-clubpilot.png" alt="clubpilot" style="height:88px;width:auto;display:block;" />
    <span style="color:rgba(255,255,255,0.5);font-size:22px;font-weight:500;letter-spacing:0.04em;">01 / 06</span>
  </div>

  <!-- header -->
  <div style="position:absolute;left:80px;top:198px;right:80px;">
    <div style="color:#0acb40;font-size:28px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:20px;">The Triad of Power</div>
    <h1 style="margin:0;font-size:78px;font-weight:600;line-height:1.06;letter-spacing:-0.02em;color:#ffffff;">
      Three Ways to Reach<br><span style="color:#0acb40;">Every Member.</span>
    </h1>
  </div>

  <!-- three pillars -->
  <div style="position:absolute;left:80px;right:80px;top:520px;display:flex;flex-direction:column;gap:22px;">

    <!-- AI Assist -->
    <div style="display:flex;align-items:center;gap:28px;padding:30px 34px;border-radius:22px;background:#101828;border:1px solid rgba(255,255,255,0.10);">
      <div style="width:92px;height:92px;border-radius:22px;background:rgba(10,203,64,0.14);display:flex;align-items:center;justify-content:center;flex:none;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#0acb40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"></path>
          <path d="M12.5 7.6l.85 2.05 2.05.85-2.05.85-.85 2.05-.85-2.05-2.05-.85 2.05-.85z" fill="#0acb40" stroke="none"></path>
        </svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:36px;font-weight:600;color:#ffffff;">AI Assist</div>
        <div style="font-size:24px;font-weight:500;color:rgba(255,255,255,0.6);margin-top:6px;">A 24/7 concierge that answers members instantly.</div>
      </div>
      <span style="font-size:26px;font-weight:600;color:#0acb40;flex:none;">01</span>
    </div>

    <!-- Text Messaging -->
    <div style="display:flex;align-items:center;gap:28px;padding:30px 34px;border-radius:22px;background:#101828;border:1px solid rgba(255,255,255,0.10);">
      <div style="width:92px;height:92px;border-radius:22px;background:rgba(239,106,36,0.14);display:flex;align-items:center;justify-content:center;flex:none;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#ef6a24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"></path>
          <circle cx="8.6" cy="11.5" r="1.05" fill="#ef6a24" stroke="none"></circle>
          <circle cx="12.5" cy="11.5" r="1.05" fill="#ef6a24" stroke="none"></circle>
          <circle cx="16.4" cy="11.5" r="1.05" fill="#ef6a24" stroke="none"></circle>
        </svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:36px;font-weight:600;color:#ffffff;">Text Messaging</div>
        <div style="font-size:24px;font-weight:500;color:rgba(255,255,255,0.6);margin-top:6px;">Reach members where 98% of texts get opened.</div>
      </div>
      <span style="font-size:26px;font-weight:600;color:#ef6a24;flex:none;">02</span>
    </div>

    <!-- Member App -->
    <div style="display:flex;align-items:center;gap:28px;padding:30px 34px;border-radius:22px;background:#101828;border:1px solid rgba(255,255,255,0.10);">
      <div style="width:92px;height:92px;border-radius:22px;background:rgba(0,158,232,0.14);display:flex;align-items:center;justify-content:center;flex:none;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#009ee8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2.5" width="12" height="19" rx="2.6"></rect>
          <line x1="10.5" y1="18.6" x2="13.5" y2="18.6"></line>
        </svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:36px;font-weight:600;color:#ffffff;">Member App</div>
        <div style="font-size:24px;font-weight:500;color:rgba(255,255,255,0.6);margin-top:6px;">Everything the club offers, in one branded place.</div>
      </div>
      <span style="font-size:26px;font-weight:600;color:#009ee8;flex:none;">03</span>
    </div>
  </div>

  <!-- CTA + handle, clear of the bottom 14% -->
  <div style="position:absolute;left:80px;bottom:185px;display:flex;align-items:center;gap:32px;">
    <a href="#" style="display:inline-flex;align-items:center;justify-content:center;padding:26px 56px;border-radius:999px;background:linear-gradient(180deg,#ed5901 0%,#b83c00 100%);box-shadow:0 16px 36px -10px rgba(237,89,1,0.5);color:#fff;font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:0.06em;text-decoration:none;">Book a Demo</a>
    <span style="color:rgba(255,255,255,0.6);font-size:24px;font-weight:500;">@clubpilot</span>
  </div>
</div>
</x-dc>
</body>
</html>
