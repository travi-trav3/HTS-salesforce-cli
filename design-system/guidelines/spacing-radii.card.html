<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Cards 16–24 · bubble 28 · button full pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--cp-canvas); color:#fff; padding:24px;
         display:flex; gap:18px; align-items:center; }
  .box { width:96px; height:96px; background:var(--cp-surface); border:1px solid var(--cp-line);
         display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; box-sizing:border-box;
         font-size:11px; font-family:monospace; color:var(--cp-slate-muted); }
  .pill { width:150px; height:56px; background:var(--cp-grad-orange); border-radius:999px; border:0;
          display:flex; align-items:center; justify-content:center; font-size:11px; font-family:monospace; color:#fff; }
</style>
</head>
<body>
  <div class="box" style="border-radius:8px">8</div>
  <div class="box" style="border-radius:16px">16</div>
  <div class="box" style="border-radius:24px">24</div>
  <div class="box" style="border-radius:28px">28&middot;bubble</div>
  <div class="pill">999 &middot; pill</div>
</body>
</html>
