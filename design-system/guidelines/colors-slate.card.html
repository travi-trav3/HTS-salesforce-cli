<!-- @dsCard group="Colors" viewport="700x150" name="Slate messaging & neutrals" subtitle="The calm conversation surface — never an accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--cp-canvas); }
  .row { display:flex; gap:14px; padding:20px; }
  .sw { flex:1; height:108px; border-radius:12px;
        display:flex; flex-direction:column; justify-content:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { color:#fff; font-size:13px; font-weight:600; }
  .sw span { color:rgba(255,255,255,.65); font-size:11px; font-family:monospace; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--cp-slate)"><b>Slate</b><span>#435267</span></div>
    <div class="sw" style="background:var(--cp-slate-light)"><b>Slate light</b><span>#4f6078</span></div>
    <div class="sw" style="background:var(--cp-slate-muted)"><b>Slate muted</b><span>#95a0b3</span></div>
    <div class="sw" style="background:var(--cp-gray)"><b>Gray text</b><span>#989898</span></div>
  </div>
</body>
</html>
