<!-- @dsCard group="Type" viewport="700x200" name="Stat numeral" subtitle="Montserrat Bold — the numeral is the hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-display); background:var(--cp-canvas); color:#fff;
         padding:24px 28px; display:flex; align-items:center; gap:28px; }
  .stat { font-size:120px; font-weight:700; line-height:.9; letter-spacing:-.03em; }
  .stat em { color:var(--cp-green-confirm); font-style:normal; }
  .label { color:rgba(255,255,255,.8); font-size:20px; font-weight:500; max-width:240px; }
  .label b { color:var(--cp-green-confirm); }
</style>
</head>
<body>
  <div class="stat">98<em>%</em></div>
  <div class="label">text <b>open rate</b> within 3 minutes</div>
</body>
</html>
