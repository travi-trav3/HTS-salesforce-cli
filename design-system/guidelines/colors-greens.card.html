<!-- @dsCard group="Colors" viewport="700x150" name="Greens — three distinct roles" subtitle="Emerald brand · confirmation · acid accent (never collapse)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--cp-canvas); }
  .row { display:flex; gap:14px; padding:20px; }
  .sw { flex:1; height:108px; border-radius:12px;
        display:flex; flex-direction:column; justify-content:flex-end; padding:12px; box-sizing:border-box; }
  .sw b { color:#03210f; font-size:13px; font-weight:700; }
  .sw span { color:rgba(0,0,0,.55); font-size:11px; font-family:monospace; }
  .sw small { color:rgba(0,0,0,.5); font-size:10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--cp-green-brand)"><b>Brand</b><span>#04ae4d</span><small>wordmark · accents</small></div>
    <div class="sw" style="background:var(--cp-green-confirm)"><b>Confirm</b><span>#0acb40</span><small>checks · send</small></div>
    <div class="sw" style="background:var(--cp-acid)"><b>Acid</b><span>#45ff16</span><small>seasoning only</small></div>
    <div class="sw" style="background:var(--cp-lime)"><b>Lime</b><span>#d9ef15</span><small>punctuation</small></div>
  </div>
</body>
</html>
