<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8pt base" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-body); background:var(--cp-canvas); color:#fff; padding:24px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:var(--cp-green-brand); width:26px; border-radius:4px; }
  .col span { font-size:11px; font-family:monospace; color:var(--cp-slate-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><span>4</span></div>
    <div class="col"><div class="bar" style="height:8px"></div><span>8</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span>12</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span>16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span>24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span>32</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span>48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span>64</span></div>
    <div class="col"><div class="bar" style="height:96px"></div><span>96</span></div>
  </div>
</body>
</html>
