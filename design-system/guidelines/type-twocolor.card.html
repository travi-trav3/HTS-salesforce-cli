<!-- @dsCard group="Type" viewport="700x190" name="Two-color headline pattern" subtitle="Tension in white → resolution flips to brand green" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-display); background:var(--cp-canvas); color:#fff; padding:30px 28px; }
  h1 { margin:0; font-size:40px; font-weight:600; line-height:1.16; }
  .res { color:var(--cp-green-confirm); }
  .alt { color:var(--cp-orange-flat); }
  .meta { color:var(--cp-slate-muted); font-size:12px; font-family:monospace; margin-top:16px; }
</style>
</head>
<body>
  <h1>Replace calls. Outperform email.<br><span class="res">Unlock text communication.</span></h1>
  <div class="meta">resolution line → green (default) or <span class="alt">orange</span> for action emphasis</div>
</body>
</html>
